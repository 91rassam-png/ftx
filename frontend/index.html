<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE DESK — AI 리서치 데스크</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="tape-wrap">
  <div class="tv-ticker-tape"></div>
</div>

<header class="masthead">
  <div class="masthead-inner">
    <div class="brand">
      <span class="brand-mark">◆</span>
      <div class="brand-text">
        <div class="brand-title">THE DESK</div>
        <div class="brand-sub">AI 리서치 데스크 · 4인 애널리스트 체제</div>
      </div>
    </div>
    <form id="ticker-form" class="ticker-form">
      <input id="ticker-input" type="text" placeholder="AAPL, TSLA, 005930 ..." autocomplete="off" spellcheck="false">
      <button type="submit" id="analyze-btn">분석 개시</button>
    </form>
  </div>
</header>

<main class="layout">

  <section class="chart-panel panel">
    <div class="panel-label"><span class="dot"></span>CHART <span class="panel-label-sym" id="chart-symbol-label">—</span></div>
    <div id="tv-chart-container" class="tv-chart-container">
      <div class="chart-placeholder">티커를 입력하고 분석을 시작하면<br>차트가 표시됩니다</div>
    </div>
  </section>

  <section class="desk-panel panel">
    <div class="panel-label"><span class="dot"></span>THE FLOOR — 애널리스트 4인</div>
    <div class="desks" id="desks">
      <!-- desk cards injected by JS -->
    </div>
  </section>

  <section class="research-panel panel" id="research-panel">
    <div class="panel-label"><span class="dot"></span>RESEARCH DESK — 종합 노트</div>
    <div class="research-body" id="research-body">
      <div class="empty-state">애널리스트 4인의 분석이 끝나면<br>리서치팀이 bull/bear 케이스를 종합합니다</div>
    </div>
  </section>

  <section class="verdict-panel panel" id="verdict-panel">
    <div class="panel-label"><span class="dot"></span>ACE — 최종 판단</div>
    <div class="verdict-body" id="verdict-body">
      <div class="empty-state">리서치팀의 종합 노트를 바탕으로<br>Ace가 최종 결정을 내립니다</div>
    </div>
  </section>

</main>

<footer class="site-footer">
  이 결과는 AI 기반 참고용 리서치이며 투자 자문이 아닙니다. 최종 투자 판단과 책임은 본인에게 있습니다.
</footer>

<script src="https://s3.tradingview.com/tv.js"></script>
<script src="app.js"></script>
</body>
</html>
